# Netlify — one-click deploy configuration.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"
  # Your live address. Uncomment it, put your own domain in, and canonical
  # tags, Open Graph URLs, robots.txt and sitemap.xml all follow. Leave it
  # commented out and the build warns and ships noindex on every page.
  # SITE = "https://your-domain.com"

# Security headers. The security block below is character-for-character the
# same as the one in public/_headers, so the site is protected the same way on
# either host. The caching rules are NOT here: public/_headers also carries
# /* and /_astro/* Cache-Control blocks, and Netlify reads that file from the
# published folder as well. The two cloudflareinsights hosts are only needed
# when you deploy to Cloudflare with Web Analytics on; delete them otherwise.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
